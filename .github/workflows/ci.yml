name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.109.1'

      - name: Start Supabase
        run: supabase start

      - name: Verify Supabase is running (no secrets in logs)
        run: |
          # Health check that only confirms the local API is reachable,
          # without printing anon/service-role keys or the JWT secret.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/rest/v1/ >/dev/null 2>&1; then
              echo "Supabase API reachable on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Supabase API not reachable after start"
          exit 1

      - name: Reset database for pgTAP tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run pgTAP tests
        run: |
          set -euo pipefail
          supabase test db supabase/tests/database

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Backend Test Dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-test.txt

      - name: Extract Supabase local keys (no echo)
        shell: bash
        run: |
          set -euo pipefail

          # Validação sanitizada, sem imprimir o JSON.
          supabase status -o json >/dev/null
          echo "Supabase status verified (no secrets printed)"

          env_out="$(supabase status -o env)"

          anon_key="$(
            awk -F= '$1 == "ANON_KEY" {
              sub(/^"/, "", $2)
              sub(/"$/, "", $2)
              print $2
            }' <<<"$env_out"
          )"

          service_key="$(
            awk -F= '$1 == "SERVICE_ROLE_KEY" {
              sub(/^"/, "", $2)
              sub(/"$/, "", $2)
              print $2
            }' <<<"$env_out"
          )"

          if [[ -z "$anon_key" || -z "$service_key" ]]; then
            echo "Failed to extract required Supabase credentials" >&2
            exit 1
          fi

          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"

          echo "SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Reset database for admission ledger integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Admission Ledger Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          python -m pytest -q -ra backend/tests/test_admission_ledger_integration.py

      - name: Reset database for legacy upgrade tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Legacy Upgrade Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          python -m pytest -q -ra backend/tests/test_legacy_upgrade.py

      - name: Reset database for authorization tests
        run: |
          supabase db reset

      - name: Run Database Authorization Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          python -m pytest -q -ra backend/tests/test_database_authorization_integration.py

      - name: Stop Supabase
        if: always()
        run: supabase stop

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-test.txt

      - name: Install dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install -r backend/requirements-test.txt
          python -m pip check

      - name: Verify CPU-only Torch
        run: |
          python -c "import torch; assert '+cpu' in torch.__version__, 'Torch is not CPU-only variant'"
          python -c "import torch; assert torch.cuda.is_available() is False, 'CUDA is available'"
          python -m pip freeze > installed.txt
          ! grep -iE 'nvidia-|cuda-|nvidia-cublas-|nvidia-cudnn-|nvidia-nccl-' installed.txt

      - name: Compile Backend
        run: |
          python -m compileall -q backend

      - name: Run Tests (excluding Supabase-dependent integration)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: "."
          PYTHONFAULTHANDLER: "1"
        run: |
          timeout --signal=TERM --kill-after=30s 20m \
            python -m pytest backend/tests \
              --ignore=backend/tests/test_database_authorization_integration.py \
              --ignore=backend/tests/test_admission_ledger_integration.py \
              --ignore=backend/tests/test_legacy_upgrade.py \
              -ra

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: ./frontend
        run: |
          set +e
          npm audit --json > audit.json
          audit_exit=$?
          set -e
          echo "npm audit finalizado com exit code: $audit_exit"
          node scripts/audit-validator.js audit.json $audit_exit

      - name: Archive Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/audit.json

      - name: Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build
