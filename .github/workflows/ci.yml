name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: '2.109.1'

      - name: Start Supabase
        shell: bash
        run: |
          set -uo pipefail
          log_file="$(mktemp)"
          trap 'rm -f "$log_file"' EXIT
          if supabase start >"$log_file" 2>&1; then
            echo "Supabase local stack started"
          else
            echo "::error::Supabase local stack failed to start"
            # Sanitized diagnostic: never print lines that may carry keys,
            # JWTs, passwords, or credentialed connection strings.
            grep -vEi \
              -e 'publishable' \
              -e 'secret' \
              -e 'anon' \
              -e 'service_role' \
              -e 'jwt' \
              -e 'password' \
              -e 'access.?key' \
              -e 'postgres(ql)?://' \
              -e '://[^/@[:space:]]+@' \
              "$log_file" || true
            exit 1
          fi

      - name: Verify Supabase is running (no secrets in logs)
        run: |
          # Health check that only confirms the local API is reachable,
          # without printing anon/service-role keys or the JWT secret.
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:54321/rest/v1/ >/dev/null 2>&1; then
              echo "Supabase API reachable on attempt $i"
              exit 0
            fi
            sleep 2
          done
          echo "Supabase API not reachable after start"
          exit 1

      - name: Reset database for pgTAP tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run pgTAP tests
        run: |
          set -euo pipefail
          supabase test db supabase/tests/database

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Sync locked backend environment (fails on lock drift)
        working-directory: backend
        run: uv sync --frozen

      - name: Extract Supabase local keys (no echo)
        shell: bash
        run: |
          set -euo pipefail

          # Validação sanitizada, sem imprimir o JSON.
          supabase status -o json >/dev/null
          echo "Supabase status verified (no secrets printed)"

          env_out="$(supabase status -o env)"

          anon_key="$(
            awk -F= '$1 == "ANON_KEY" {
              sub(/^"/, "", $2)
              sub(/"$/, "", $2)
              print $2
            }' <<<"$env_out"
          )"

          service_key="$(
            awk -F= '$1 == "SERVICE_ROLE_KEY" {
              sub(/^"/, "", $2)
              sub(/"$/, "", $2)
              print $2
            }' <<<"$env_out"
          )"

          if [[ -z "$anon_key" || -z "$service_key" ]]; then
            echo "Failed to extract required Supabase credentials" >&2
            exit 1
          fi

          echo "::add-mask::$anon_key"
          echo "::add-mask::$service_key"

          echo "SUPABASE_ANON_KEY=$anon_key" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$service_key" >> "$GITHUB_ENV"

      - name: Reset database for admission ledger integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Admission Ledger Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          uv run --project backend python -m pytest -q -ra backend/tests/test_admission_ledger_integration.py

      - name: Reset database for legacy upgrade tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Legacy Upgrade Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Hide every migration AFTER the hardening target (02) so the legacy
          # upgrade scenario starts from a true baseline-only database, then
          # restore them (even on failure). See scripts/hide-migrations-after.sh.
          bash scripts/hide-migrations-after.sh 20240101000002 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_legacy_upgrade.py

      - name: Reset database for transactional schema legacy tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Transactional Schema Legacy Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # The test hides migration 04 to simulate a legacy pre-transactional
          # database; every migration AFTER 04 (currently 05, future ones too)
          # must be hidden as well because they hard-depend on 04's tables.
          bash scripts/hide-migrations-after.sh 20240101000004 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_transactional_schema_legacy.py

      - name: Reset database for transactional schema integration tests
        run: |
          supabase db reset

      - name: Run Transactional Schema Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          uv run --project backend python -m pytest -q -ra backend/tests/test_transactional_schema_integration.py

      - name: Reset database for authorization tests
        run: |
          supabase db reset

      - name: Run Database Authorization Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          uv run --project backend python -m pytest -q -ra backend/tests/test_database_authorization_integration.py

      - name: Reset database for atomic turn commit integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Atomic Turn Commit Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_atomic_turn_commit_integration.py

      - name: Reset database for process turn integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Process Turn Integration Tests (replay RPC + multi-worker)
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_process_turn_integration.py

      - name: Reset database for rls_auto_enable legacy tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run RLS Auto Enable Legacy Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Hide every migration AFTER the replay migration (06) so the legacy
          # scenario starts from a true pre-hardening database; the new
          # migration is restored inside the test before applying it.
          bash scripts/hide-migrations-after.sh 20240101000006 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_rls_auto_enable_legacy.py

      - name: Reset database for privacy operations integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Privacy Operations Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_privacy_operations_integration.py

      - name: Reset database for privacy operations legacy tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Privacy Operations Legacy Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Hide every migration AFTER the replay migration (06) so the legacy
          # scenario starts from a true pre-privacy database; the new
          # migration is restored inside the test before applying it.
          bash scripts/hide-migrations-after.sh 20240101000006 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_privacy_operations_legacy.py

      - name: Reset database for privacy operations preflight tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Privacy Operations Preflight Test (missing dependency -> 23514)
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # The preflight gate must be exercised by CI, not just exist: each
          # case hides the new migration, resets the pre-privacy baseline,
          # drops exactly one mandatory table and requires the migration to
          # fail with 23514 before installing any object.
          bash scripts/hide-migrations-after.sh 20240101000006 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_privacy_operations_preflight.py

      - name: Reset database for privacy API integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Privacy API Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_privacy_api_integration.py

      - name: Reset database for retention preflight tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Retention Preflight Test (missing dependency -> 23514)
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # The retention preflight gate must be exercised by CI: each case
          # hides the new migration, resets the pre-retention baseline,
          # drops exactly one mandatory operational table and requires the
          # migration to fail with 23514 before installing any function.
          bash scripts/hide-migrations-after.sh 20260808220000 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_retention_preflight.py

      - name: Reset database for retention integration tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Retention Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_retention_integration.py

      - name: Run Account Deletion Integration Tests
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_ANON_KEY: "${{ env.SUPABASE_ANON_KEY }}"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          uv run --project backend python -m pytest -q -ra backend/tests/test_account_deletion_integration.py

      - name: Reset database for account deletion legacy upgrade test
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Account Deletion Legacy Upgrade Test
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          SUPABASE_SERVICE_ROLE_KEY: "${{ env.SUPABASE_SERVICE_ROLE_KEY }}"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Simulates a legacy database (migrations before the account
          # deletion ledger) and applies the new migration via
          # `supabase migration up --local`.
          bash scripts/hide-migrations-after.sh 20260809030000 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_account_deletion_legacy.py

      - name: Reset database for account deletion preflight tests
        run: |
          set -euo pipefail
          supabase db reset

      - name: Run Account Deletion Preflight Test (missing dependency -> 23514)
        env:
          SUPABASE_URL: "http://127.0.0.1:54321"
          PYTHONPATH: "."
        run: |
          set -euo pipefail
          # Each case hides the new migration, resets the pre-ledger
          # baseline, drops exactly one mandatory table and requires the
          # migration to fail with 23514 before installing anything.
          bash scripts/hide-migrations-after.sh 20260809030000 \
            uv run --project backend python -m pytest -q -ra backend/tests/test_account_deletion_preflight.py

      - name: Stop Supabase
        if: always()
        run: supabase stop

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Sync locked backend environment (fails on lock drift)
        working-directory: backend
        run: |
          uv sync --frozen
          uv pip check --project backend

      - name: Verify CPU-only Torch
        run: |
          uv run --project backend python -c "import torch; assert '+cpu' in torch.__version__, 'Torch is not CPU-only variant'"
          uv run --project backend python -c "import torch; assert torch.cuda.is_available() is False, 'CUDA is available'"
          uv pip list --project backend > installed.txt
          ! grep -iE 'nvidia-|cuda-|nvidia-cublas-|nvidia-cudnn-|nvidia-nccl-' installed.txt

      - name: Compile Backend
        run: |
          uv run --project backend python -m compileall -q backend

      - name: Run Tests (excluding Supabase-dependent integration)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONPATH: "."
          PYTHONFAULTHANDLER: "1"
        run: |
          timeout --signal=TERM --kill-after=30s 20m \
            uv run --project backend python -m pytest backend/tests \
              --ignore=backend/tests/test_database_authorization_integration.py \
              --ignore=backend/tests/test_admission_ledger_integration.py \
              --ignore=backend/tests/test_legacy_upgrade.py \
              --ignore=backend/tests/test_transactional_schema_legacy.py \
              --ignore=backend/tests/test_transactional_schema_integration.py \
              --ignore=backend/tests/test_atomic_turn_commit_integration.py \
              --ignore=backend/tests/test_process_turn_integration.py \
              --ignore=backend/tests/test_rls_auto_enable_legacy.py \
              --ignore=backend/tests/test_privacy_operations_integration.py \
              --ignore=backend/tests/test_privacy_operations_legacy.py \
              --ignore=backend/tests/test_privacy_operations_preflight.py \
              --ignore=backend/tests/test_privacy_api_integration.py \
              --ignore=backend/tests/test_retention_integration.py \
              --ignore=backend/tests/test_retention_preflight.py \
              --ignore=backend/tests/test_account_deletion_integration.py \
              --ignore=backend/tests/test_account_deletion_legacy.py \
              --ignore=backend/tests/test_account_deletion_preflight.py \
              -ra

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Audit dependencies
        working-directory: ./frontend
        run: |
          set +e
          npm audit --json > audit.json
          audit_exit=$?
          set -e
          echo "npm audit finalizado com exit code: $audit_exit"
          node scripts/audit-validator.js audit.json $audit_exit

      - name: Archive Audit Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: frontend/audit.json

      - name: Run Tests
        working-directory: ./frontend
        run: npm test

      - name: Lint
        working-directory: ./frontend
        run: npm run lint

      - name: Build
        working-directory: ./frontend
        run: npm run build

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create sanitized test environment
        run: |
          cat > .env <<'EOF'
          APP_ENV=test
          ADMISSION_HMAC_SECRET=ci-test-secret-0123456789abcdef0123456789abcdef
          TRUSTED_PROXY_CIDRS=
          CORS_ALLOWED_ORIGINS=http://allowed.example
          SUPABASE_URL=http://127.0.0.1:1
          SUPABASE_SERVICE_ROLE_KEY=ci-test-key
          GROQ_API_KEY=ci-test-key
          GROQ_API_KEY_2=ci-test-key
          ARCHIVAL_EXTRACTION_ENABLED=false
          HF_HUB_OFFLINE=1
          TRANSFORMERS_OFFLINE=1
          VITE_API_URL=http://localhost:8000
          VITE_SUPABASE_URL=http://127.0.0.1:1
          VITE_SUPABASE_ANON_KEY=ci-test-key.ci-test-key.ci-test-key
          EOF

      - name: Validate compose configuration
        run: docker compose config --quiet

      - name: Frontend build fails when required configuration is missing
        run: |
          set +e
          docker build -f frontend/Dockerfile frontend > /tmp/frontend-invalid-build.log 2>&1
          exit_code=$?
          set -e
          if [ "$exit_code" -eq 0 ]; then
            echo "frontend build succeeded without required VITE_* args" >&2
            exit 1
          fi
          grep -Fq "Missing required VITE_* build argument" /tmp/frontend-invalid-build.log
          echo "frontend build correctly failed with the VITE_* validation message"

      - name: Build backend and frontend images without cache
        run: docker compose build --no-cache

      - name: Start the stack
        run: docker compose up -d

      - name: Backend liveness (TCP healthcheck on port 8000)
        run: |
          for i in $(seq 1 60); do
            cid="$(docker compose ps -q backend)"
            if [ -n "$cid" ]; then
              status="$(docker inspect -f '{{.State.Health.Status}}' "$cid" 2>/dev/null || true)"
              if [ "$status" = "healthy" ]; then
                exit 0
              fi
            fi
            sleep 2
          done
          echo "backend container did not become healthy" >&2
          exit 1

      - name: Frontend serves index, asset and SPA fallback
        run: |
          curl -fsS http://127.0.0.1/ | grep -q "SoulMate"
          asset="$(curl -fsS http://127.0.0.1/ | grep -oE '/assets/[^"]+\.js' | head -n1)"
          test -n "$asset"
          curl -fsS -o /dev/null "http://127.0.0.1$asset"
          code="$(curl -fsS -o /dev/null -w '%{http_code}' http://127.0.0.1/qualquer/rota/spa)"
          test "$code" = "200"

      - name: Allowed CORS origin is reflected
        run: |
          curl -fsS -D- -o /dev/null \
            -H "Origin: http://allowed.example" \
            http://127.0.0.1:8000/health \
            | grep -i "^access-control-allow-origin: http://allowed.example"

      - name: Disallowed CORS origin is not allowed
        run: |
          headers="$(curl -fsS -D- -o /dev/null \
            -H "Origin: http://denied.example" \
            http://127.0.0.1:8000/health)"
          if echo "$headers" | grep -qi "^access-control-allow-origin:"; then
            echo "unexpected access-control-allow-origin for disallowed origin" >&2
            exit 1
          fi

      - name: Stop and remove containers and volumes
        if: always()
        run: docker compose down -v

  desktop-package:
    name: Desktop .deb package
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv (pinned)
        uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-path: backend/uv.lock

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build production frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Install native desktop runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            python3.12 \
            python3-gi \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-0 \
            libgtk-3-0 \
            libglib2.0-0

      - name: Run packaging contract tests
        run: |
          uv sync --frozen --project backend
          uv run --project backend python -m compileall -q backend packaging
          uv run --project backend python -m pytest -q \
            packaging/test_build_deb.py \
            packaging/test_gui_smoke_contract.py

      - name: Build old and new packages with a fixed source date
        env:
          SOURCE_DATE_EPOCH: "1700000000"
        run: |
          set -euo pipefail
          python packaging/build_deb.py \
            --version 0.1.0~ci1 \
            --out-dir /tmp/katherine-deb-old
          python packaging/build_deb.py \
            --version 0.1.0~ci2 \
            --out-dir /tmp/katherine-deb-new-a
          python packaging/build_deb.py \
            --version 0.1.0~ci2 \
            --out-dir /tmp/katherine-deb-new-b
          cmp \
            /tmp/katherine-deb-new-a/katherine-desktop_0.1.0~ci2_amd64.deb \
            /tmp/katherine-deb-new-b/katherine-desktop_0.1.0~ci2_amd64.deb

      - name: Inspect package contract
        run: |
          set -euo pipefail
          deb=/tmp/katherine-deb-new-a/katherine-desktop_0.1.0~ci2_amd64.deb
          dpkg-deb -f "$deb" Package Version Architecture Depends Installed-Size
          test "$(dpkg-deb -f "$deb" Architecture)" = amd64
          listing="$(dpkg-deb -c "$deb")"
          grep -Fq './usr/bin/katherine' <<<"$listing"
          grep -Fq './usr/lib/katherine/frontend/dist/desktop.html' <<<"$listing"
          grep -Fq './usr/lib/katherine/vendor/' <<<"$listing"
          if grep -Eiq '/(katherine\.db|\.env)(/|$)' <<<"$listing"; then
            echo "user data or environment file included in package" >&2
            exit 1
          fi
          if grep -Eiq \
            '/usr/lib/katherine/vendor/(fastapi|uvicorn|supabase|torch|numpy)(/|-)' \
            <<<"$listing"; then
            echo "cloud or ML dependency included in desktop vendor tree" >&2
            exit 1
          fi

      - name: Run real isolated dpkg lifecycle
        id: lifecycle
        shell: bash
        run: |
          set +e
          python packaging/smoke_deb.py \
            --deb /tmp/katherine-deb-new-a/katherine-desktop_0.1.0~ci2_amd64.deb \
            --old-deb /tmp/katherine-deb-old/katherine-desktop_0.1.0~ci1_amd64.deb \
            > /tmp/katherine-lifecycle.log 2>&1
          rc=$?
          cat /tmp/katherine-lifecycle.log
          if [ "$rc" -eq 0 ]; then
            echo "namespace_available=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if grep -Eqi \
            'unshare.*(operation not permitted|permission denied|invalid argument)|cannot open user namespace' \
            /tmp/katherine-lifecycle.log; then
            echo "namespace_available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::GitHub runner blocked unprivileged user/mount namespaces; the real lifecycle was attempted and is recorded above. The host-level smoke remains the acceptance evidence."
            exit 0
          fi
          exit "$rc"

      - name: Run installed package provider path
        if: steps.lifecycle.outputs.namespace_available == 'true'
        run: |
          set -euo pipefail
          bash packaging/isolated-install.sh \
            /tmp/katherine-deb-new-a/katherine-desktop_0.1.0~ci2_amd64.deb \
            "cd /tmp && PYTHONPATH=/install-root/usr/lib/katherine:/install-root/usr/lib/katherine/vendor python3.12 /oldroot${GITHUB_WORKSPACE}/packaging/provider_smoke.py"

      - name: Record namespace limitation when lifecycle cannot run
        if: steps.lifecycle.outputs.namespace_available == 'false'
        run: |
          echo "Real dpkg lifecycle was attempted but this GitHub runner denied the required unprivileged namespace operation."
          echo "No mock lifecycle substituted. Re-run packaging/smoke_deb.py on a host with user and mount namespaces enabled."
