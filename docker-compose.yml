services:
  backend:
    build:
      context: ./backend
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Liveness only: proves the process accepts connections. It does not
    # assert readiness against Supabase/auth/provider.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      # Required build-time configuration; the Dockerfile fails the build
      # when any of these is missing or malformed.
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    restart: unless-stopped
