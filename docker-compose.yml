services:
  backend:
    build:
      context: ./backend
    # The .env file must declare APP_ENV (local/test/staging/production):
    # Settings.from_env() fails closed when it is missing, so the backend
    # never silently runs in an implicit mode.
    env_file: .env
    ports:
      - "8000:8000"
    restart: unless-stopped
    # Liveness only: TCP check proves the process accepts connections. It
    # does not call any HTTP endpoint and does not assert readiness against
    # Supabase/auth/provider.
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8000), timeout=3).close()",
        ]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      # Required build-time configuration; the Dockerfile fails the build
      # when any of these is missing or malformed.
      args:
        VITE_API_URL: ${VITE_API_URL}
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${VITE_SUPABASE_ANON_KEY}
    ports:
      - "80:80"
    restart: unless-stopped
