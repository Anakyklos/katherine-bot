[pytest]
asyncio_mode = strict
addopts = --strict-markers
filterwarnings =
    error
    # Temporary compatibility with the pinned PostgREST client
    # (postgrest==2.31.0): creating the sync Supabase client without an
    # explicit http_client makes postgrest emit DeprecationWarnings for the
    # 'timeout' and 'verify' parameters. Narrow, exact-message exceptions;
    # remove them once the pinned client no longer emits these warnings.
    ignore:^The 'timeout' parameter is deprecated\. Please configure it in the http client instead\.$:DeprecationWarning
    ignore:^The 'verify' parameter is deprecated\. Please configure it in the http client instead\.$:DeprecationWarning
    ignore::starlette.exceptions.StarletteDeprecationWarning
markers =
    database_integration: tests requiring a live Supabase/PostgreSQL database
