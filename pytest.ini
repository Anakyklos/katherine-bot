[pytest]
asyncio_mode = strict
addopts = --strict-markers
# Narrow fail-fast guard: an async test without the asyncio marker must never
# be silently skipped. --strict-markers already rejects unknown markers.
filterwarnings =
    error::pytest.PytestUnhandledCoroutineWarning
markers =
    database_integration: tests requiring a live Supabase/PostgreSQL database
